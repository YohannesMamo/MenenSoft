          "@type": "Question",
          "name": "How much storage does offline mode need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Downloading the offline version takes about 300–500 MB, which includes the app and all your grade's notes and basic quizzes. After that, everything works without an internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "Will I lose my progress if I study offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your progress, scores, and notes are stored locally on your device. When you are back online, your results sync with your account so you can see them on any device and in your report card."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get updates?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The browser and APK versions update automatically when you connect to the internet. For the offline version, new content and features are delivered through periodic app updates that you download from the website."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your account is protected with secure sign-in, and your study data stays on your device in offline mode. Premium exam and ESLCE content is delivered separately after purchase."
          }
        },
        {
          "@type": "Question",
          "name": "Can I switch between browser, APK, and offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can study in the browser or the APK whenever you have internet, and use the offline app when you do not. Your progress is kept in sync so you never lose your place between modes."
          }
        }
      ]
    }
